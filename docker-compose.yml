services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow123
      POSTGRES_DB: payflow
    ports:
      - "5433:5432"
    volumes:
      - payflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_user -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payflow_postgres_data: